# =============================
# roBa Left Half (Peripheral)
# =============================

CONFIG_NFCT_PINS_AS_GPIOS=y

# --------------------------
# Features
# --------------------------
CONFIG_ZMK_POINTING=y

# --------------------------
# Encoder
# --------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --------------------------
# Battery Reporting (Peripheral)
# --------------------------
CONFIG_ZMK_BATTERY_REPORTING=y

# --------------------------
# Debounce (lower = faster response, higher = more stable)
# --------------------------
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# --------------------------
# Power Saving
# --------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y

# --------------------------
# Bluetooth Connection
# --------------------------
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24